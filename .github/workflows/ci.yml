name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ruas_brasil
          POSTGRES_USER: ruas_brasil
          POSTGRES_PASSWORD: senha-apenas-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruas_brasil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: chave-apenas-para-ci-nao-usar-em-producao-0123456789abcdef
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: ruas_brasil
      POSTGRES_USER: ruas_brasil
      POSTGRES_PASSWORD: senha-apenas-para-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run
      - name: Django check
        run: python manage.py check --fail-level WARNING
      - name: Django check de produção
        env:
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Preparação de estáticos (collectstatic)
        run: python manage.py collectstatic --noinput
      - name: Testes com cobertura
        run: |
          coverage run manage.py test --noinput -v 2
          coverage report --fail-under=85
          coverage xml
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
